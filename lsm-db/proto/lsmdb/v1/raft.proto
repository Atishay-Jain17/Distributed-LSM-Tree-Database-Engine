syntax = "proto3";

package lsmdb.v1;

import "lsmdb/v1/common.proto";

// Raft's internal peer protocol. Client operations continue to use KvService.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RaftLogEntry {
  uint64 term = 1;
  bytes command = 2;
}

message RequestVoteRequest {
  RequestMeta meta = 1;
  uint64 term = 2;
  uint32 candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}
message RequestVoteResponse {
  Status status = 1;
  uint64 term = 2;
  bool vote_granted = 3;
}

message AppendEntriesRequest {
  RequestMeta meta = 1;
  uint64 term = 2;
  uint32 leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated RaftLogEntry entries = 6;
  uint64 leader_commit = 7;
}
message AppendEntriesResponse {
  Status status = 1;
  uint64 term = 2;
  bool success = 3;
  uint64 match_index = 4;
  uint64 conflict_index = 5;
}
