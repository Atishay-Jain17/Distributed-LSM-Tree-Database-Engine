# StatefulSet, not Deployment: this is what gives each pod a STABLE
# identity across restarts/rescheduling.
#
# With replicas: 3, the pods are always named:
#   <release-name>-0, <release-name>-1, <release-name>-2
# and each keeps that name (and its own PersistentVolumeClaim) forever,
# even if the pod is deleted and recreated. Raft election later depends
# on this: node identity must not shuffle around.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: lsm-db
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: lsm-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsm-db
    spec:
      containers:
        - name: lsm-db-node
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.node.port }}
              name: node-port
          env:
            # Kubernetes fills these in automatically per-pod. This is the
            # "configuration injection" mechanism Tuesday's task builds on.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_PORT
              value: "{{ .Values.node.port }}"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
