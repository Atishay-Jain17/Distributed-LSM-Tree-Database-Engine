# StatefulSet, not Deployment: this is what gives each pod a STABLE
# identity across restarts/rescheduling.
#
# With replicas: 3, the pods are always named:
#   <release-name>-0, <release-name>-1, <release-name>-2
# and each keeps that name (and its own PersistentVolumeClaim) forever,
# even if the pod is deleted and recreated. Raft election later depends
# on this: node identity must not shuffle around.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: lsm-db
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: lsm-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsm-db
    spec:
      containers:
        - name: lsm-db-node
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.node.port }}
              name: node-port
          env:
            # Kubernetes fills these in automatically per-pod via the
            # Downward API, so the SAME container image works identically
            # on every replica -- each one just reads its own identity
            # at startup instead of needing a separate image per node.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_PORT
              value: "{{ .Values.node.port }}"
            # PEERS: a comma-separated list of every node's stable DNS
            # name (via the headless service), so each node can discover
            # and dial its peers for Raft without any external service
            # registry. Built at template-render time from replicaCount,
            # so it automatically stays correct if replicaCount changes.
            - name: PEERS
              value: {{ range $i := until (int .Values.replicaCount) }}{{ $.Release.Name }}-{{ $i }}.{{ $.Release.Name }}-headless:{{ $.Values.node.port }}{{ if lt (add1 $i) (int $.Values.replicaCount) }},{{ end }}{{ end }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ .Values.storage.accessModes | toYaml | nindent 10 }}
        storageClassName: {{ .Values.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
